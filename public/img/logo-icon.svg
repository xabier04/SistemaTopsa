<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <!-- Fondo circular verde bosque -->
  <circle cx="80" cy="80" r="76" fill="#1b3d22" stroke="#f1cf63" stroke-width="4"/>
  
  <!-- Globo central -->
  <circle cx="80" cy="80" r="48" fill="#ffffff" stroke="#111827" stroke-width="6"/>
  <clipPath id="miniGlobeClip">
    <circle cx="80" cy="80" r="45"/>
  </clipPath>
  <g clip-path="url(#miniGlobeClip)">
    <!-- Norteamérica -->
    <path d="M 50,42 C 64,38 78,42 90,48 C 96,55 100,65 92,75 C 85,82 75,75 68,72 C 62,68 58,82 64,92 C 72,102 68,110 60,110 C 54,110 48,95 52,82 C 55,72 42,62 45,52 Z" fill="#2d6635"/>
    <!-- Sudamérica -->
    <path d="M 68,108 C 76,105 88,110 92,120 C 95,128 88,142 78,148 C 72,152 64,138 66,128 Z" fill="#2d6635"/>
  </g>
  <circle cx="80" cy="80" r="48" fill="none" stroke="#111827" stroke-width="6"/>

  <!-- Flecha Topográfica Dorada Superpuesta -->
  <g transform="translate(112, 48) scale(0.65)">
    <path d="M 35,-65 L -60,40 L -25,30 L 15,10 Z" fill="#f1cf63" stroke="#111827" stroke-width="8" stroke-linejoin="round"/>
    <path d="M 35,-65 L 15,10 L -25,30 L 55,60 Z" fill="#111827" stroke="#111827" stroke-width="8" stroke-linejoin="round"/>
    <polygon points="30,-50 -40,32 -18,24 10,8" fill="#f1cf63"/>
  </g>
</svg>
